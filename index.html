<style>
  :root{
    /* Palette note: blue is used as the dominant field because it supports
       focus and calm over long study sessions; a muted gold carries the one
       call-to-action (warm tones sustain attention without the alarm
       connotation of red); green is reserved only for "known" states.
       Category colour-coding (verb / connector / theme word) leans on
       colour-cued recall rather than decoration. */
    --ink:#1c2430;
    --paper:#f7f4ec;
    --blue-deep:#173151;
    --blue:#1b3a5c;
    --blue-mid:#3f6690;
    --blue-pale:#dfe8f0;
    --gold:#c08a2e;
    --gold-pale:#f2e2bd;
    --sage:#5c7a63;
    --sage-pale:#e2e9e0;
    --good:#3c7a5e;
    --line:#dcd6c6;
    --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }

  /* ---------- Header ---------- */
  .hero{
    background:linear-gradient(165deg, var(--blue-deep), var(--blue) 70%);
    color:var(--paper);
    padding:26px 22px 20px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    top:0; right:0; bottom:0;
    width:88px;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,0.06) 25%, transparent 25%);
    background-size:22px 22px;
  }
  .hero-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    position:relative;
    z-index:1;
  }
  .eyebrow{
    font-size:12.5px;
    letter-spacing:0.01em;
    color:var(--gold-pale);
    margin:0 0 2px;
  }
  .week-num{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:42px;
    line-height:1;
    margin:0;
  }
  .week-total{
    font-family:'Newsreader', serif;
    font-size:19px;
    color:rgba(247,244,236,0.55);
  }
  .theme-pill{
    display:inline-block;
    margin-top:8px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:999px;
    padding:5px 12px;
    font-size:12.5px;
    color:var(--paper);
  }
  .streak-pill{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:999px;
    padding:6px 12px;
    font-size:12.5px;
    text-align:right;
    white-space:nowrap;
  }
  .progress-track{
    margin-top:16px;
    height:5px;
    border-radius:3px;
    background:rgba(255,255,255,0.15);
    overflow:hidden;
    position:relative;
    z-index:1;
  }
  .progress-fill{
    height:100%;
    background:var(--gold);
    border-radius:3px;
    transition:width 0.4s ease;
  }
  .progress-caption{
    margin-top:7px;
    font-size:12.5px;
    color:rgba(247,244,236,0.6);
    position:relative;
    z-index:1;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:2px;
    padding:12px 16px 0;
  }
  .tab{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 4px;
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    color:#9b937f;
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .tab.active{
    color:var(--blue);
    border-bottom:2px solid var(--gold);
  }

  /* ---------- Main content ---------- */
  .content{
    flex:1;
    padding:16px 20px 40px;
  }
  .section-label{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#8b8474;
    margin:20px 0 10px;
  }
  .section-label .accent{ color:var(--gold); }
  .section-label:first-child{ margin-top:0; }
  .empty-note{
    font-family:'Newsreader', serif;
    font-style:italic;
    color:#7a7362;
    font-size:15px;
    padding:6px 2px 4px;
  }

  /* ---------- Flashcard grid ---------- */
  .card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .flash{
    position:relative;
    aspect-ratio:1/1.08;
    border-radius:10px;
    cursor:pointer;
    perspective:800px;
  }
  .flash-inner{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform 0.45s cubic-bezier(.4,.2,.2,1);
  }
  .flash.flipped .flash-inner{ transform:rotateY(180deg); }
  .flash-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
  }
  .flash-face.back{
    transform:rotateY(180deg);
    background:var(--blue-pale);
    border-color:var(--blue-mid);
  }
  .flash-word{
    font-family:'Newsreader', serif;
    font-size:15.5px;
    font-weight:500;
    line-height:1.25;
  }
  .flash-face.back .flash-word{ color:var(--blue); }
  .cat-tag{
    position:absolute;
    top:9px; left:9px;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:999px;
  }
  .cat-tag.verb{ background:var(--gold-pale); color:#8a611e; }
  .cat-tag.grammar{ background:var(--sage-pale); color:#3f5745; }
  .cat-tag.theme{ background:var(--blue-pale); color:var(--blue-mid); }
  .flash-face.back .cat-tag.theme{ background:rgba(255,255,255,0.55); }
  .flash-check{
    position:absolute;
    bottom:9px; right:9px;
    width:20px; height:20px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:transparent;
  }
  .flash-check.done{
    background:var(--good);
    border-color:var(--good);
    color:white;
  }

  /* ---------- Advance button ---------- */
  .advance-wrap{
    margin-top:26px;
    text-align:center;
  }
  .advance-btn{
    width:100%;
    background:var(--gold);
    color:#2b2005;
    border:none;
    padding:14px 16px;
    border-radius:8px;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .advance-btn:active{ opacity:0.85; }
  .advance-hint{
    font-size:12.5px;
    color:#8b8474;
    margin-top:8px;
  }
  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:18px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:12px;
    color:#5c5747;
  }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; }

  /* ---------- All words / list ---------- */
  .search-input{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    background:var(--card);
    margin-bottom:14px;
  }
  .word-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
    gap:8px;
  }
  .word-row .en{ color:var(--ink); flex:1; }
  .word-row .pt{ color:var(--blue); font-family:'Newsreader', serif; font-style:italic; flex:1; text-align:right; }
  .word-row .wk{ font-size:11px; color:#a39c8a; min-width:44px; text-align:right; }

  /* ---------- Roadmap / overview ---------- */
  .roadmap-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
  }
  .roadmap-row.current{
    background:var(--gold-pale);
    border-radius:8px;
    padding:12px 10px;
    border-bottom:none;
    margin:2px 0;
  }
  .roadmap-weeks{ font-size:11.5px; color:#8b8474; min-width:76px; }
  .roadmap-theme{ font-family:'Newsreader', serif; font-size:15px; flex:1; }
  .roadmap-status{ font-size:11px; color:var(--good); }

  /* ---------- Settings ---------- */
  .settings-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
  }
  .settings-block h3{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:17px;
    margin:0 0 6px;
    color:var(--blue);
  }
  .settings-block p{
    font-size:13.5px;
    color:#5c5747;
    line-height:1.5;
    margin:0 0 12px;
  }
  .row-btns{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-sec{
    background:var(--paper);
    border:1px solid var(--line);
    padding:9px 14px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    color:var(--blue);
    cursor:pointer;
  }
  .btn-sec.danger{ color:#a0402c; border-color:#e6b39c; }
  textarea{
    width:100%;
    min-height:90px;
    font-family:monospace;
    font-size:12.5px;
    padding:10px;
    border-radius:7px;
    border:1px solid var(--line);
    resize:vertical;
  }
  .week-jump{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .week-jump input{
    width:70px;
    padding:8px 10px;
    border-radius:7px;
    border:1px solid var(--line);
    font-family:'Work Sans', sans-serif;
  }
  .loading{
    padding:40px 20px;
    text-align:center;
    color:#8b8474;
    font-family:'Newsreader', serif;
    font-style:italic;
  }
</style>
</head>

/* =========================================================
   STATE / STORAGE
   ========================================================= */
const STORAGE_KEY = "pt-weekly-progress-v2";
let state = {
  currentWeek: 1,
  known: {}
};
let activeTab = "week";
let saveTimer = null;

function totalWeeks(){ return WEEKS.length; }
function totalWords(){ return WEEKS.reduce((sum,w)=>sum+w.length, 0); }
function wordsThrough(week){
  let sum = 0;
  for(let i=0; i<week && i<WEEKS.length; i++) sum += WEEKS[i].length;
  return sum;
}
function weekSlice(week){
  const list = WEEKS[week-1] || [];
  return list.map((triple, i) => ({
    idx: `${week}-${i}`, en: triple[0], pt: triple[1], cat: triple[2]
  }));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){ /* no saved state yet */ }
  render();
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error("Save failed", e); }
  }, 250);
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const app = document.getElementById("app");
  const tw = totalWeeks();
  if(state.currentWeek > tw) state.currentWeek = tw;
  const wordsLearned = wordsThrough(state.currentWeek);
  const pct = Math.round((wordsLearned / totalWords()) * 100);
  const currentTheme = WEEK_THEMES[state.currentWeek-1] || "";

  app.innerHTML = `
    <div class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Semana</p>
          <h1 class="week-num">${state.currentWeek}<span class="week-total"> / ${tw}</span></h1>
          <span class="theme-pill">${currentTheme}</span>
        </div>
        <div class="streak-pill">${wordsLearned} palavras<br>aprendidas</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-caption">${pct}% de ${totalWords()} palavras · ${tw} semanas ao todo</div>
    </div>

    <div class="tabs">
      <button class="tab ${activeTab==='week'?'active':''}" data-tab="week">Semana</button>
      <button class="tab ${activeTab==='roadmap'?'active':''}" data-tab="roadmap">Panorama</button>
      <button class="tab ${activeTab==='all'?'active':''}" data-tab="all">Todas</button>
      <button class="tab ${activeTab==='settings'?'active':''}" data-tab="settings">Definições</button>
    </div>

    <div class="content" id="content"></div>
  `;

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeTab = btn.dataset.tab; render(); });
  });

  const content = document.getElementById("content");
  if(activeTab === "week") renderWeek(content);
  else if(activeTab === "roadmap") renderRoadmap(content);
  else if(activeTab === "all") renderAll(content);
  else renderSettings(content);
}

function catLabel(cat){
  if(cat === "verb") return "verbo";
  if(cat === "grammar") return "conetor";
  return "tema";
}

function flashCardHTML(word){
  const isKnown = !!state.known[word.idx];
  return `
    <div class="flash" data-idx="${word.idx}">
      <div class="flash-inner">
        <div class="flash-face front">
          <span class="cat-tag ${word.cat}">${catLabel(word.cat)}</span>
          <span class="flash-word">${word.en}</span>
        </div>
        <div class="flash-face back">
          <span class="cat-tag ${word.cat}">${catLabel(word.cat)}</span>
          <span class="flash-word">${word.pt}</span>
          <div class="flash-check ${isKnown?'done':''}" data-check="${word.idx}">✓</div>
        </div>
      </div>
    </div>
  `;
}

function attachCardHandlers(container){
  container.querySelectorAll(".flash").forEach(card=>{
    card.addEventListener("click", (e)=>{
      if(e.target.dataset && e.target.dataset.check){
        e.stopPropagation();
        const idx = e.target.dataset.check;
        state.known[idx] = !state.known[idx];
        e.target.classList.toggle("done");
        queueSave();
        return;
      }
      card.classList.toggle("flipped");
    });
  });
}

function renderWeek(content){
  const newWords = weekSlice(state.currentWeek);
  const reviewWords = state.currentWeek > 1 ? weekSlice(state.currentWeek - 1) : [];
  const isLastWeek = state.currentWeek >= totalWeeks();

  let html = "";
  if(reviewWords.length){
    html += `<p class="section-label"><span class="accent">●</span> Revisão · semana ${state.currentWeek-1}</p>
      <div class="card-grid">${reviewWords.map(w=>flashCardHTML(w)).join("")}</div>`;
  } else {
    html += `<p class="section-label">Revisão</p>
      <p class="empty-note">A tua primeira semana — ainda não há palavras para rever. Elas aparecem a partir da semana 2.</p>`;
  }

  html += `<p class="section-label"><span class="accent">●</span> Novas · semana ${state.currentWeek}</p>
    <div class="card-grid">${newWords.map(w=>flashCardHTML(w)).join("")}</div>`;

  html += `<div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#c08a2e"></span> verbo</span>
      <span class="legend-item"><span class="legend-dot" style="background:#5c7a63"></span> conetor</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3f6690"></span> tema da semana</span>
    </div>`;

  html += `<div class="advance-wrap">
      <button class="advance-btn" id="advanceBtn" ${isLastWeek?'disabled style="opacity:0.5"':''}>
        ${isLastWeek ? 'Última semana concluída 🎉' : `Avançar para a semana ${state.currentWeek+1} →`}
      </button>
      <p class="advance-hint">Toca numa carta para virar. O ✓ é só para tua referência — não muda o calendário.</p>
    </div>`;

  content.innerHTML = html;
  attachCardHandlers(content);

  const btn = document.getElementById("advanceBtn");
  if(btn && !isLastWeek){
    btn.addEventListener("click", ()=>{
      state.currentWeek += 1;
      queueSave();
      render();
    });
  }
}

function renderRoadmap(content){
  // group consecutive weeks by theme for a readable overview
  const groups = [];
  WEEK_THEMES.forEach((theme, i)=>{
    const week = i+1;
    if(groups.length && groups[groups.length-1].theme === theme){
      groups[groups.length-1].end = week;
    } else {
      groups.push({theme, start: week, end: week});
    }
  });

  let html = `<p class="empty-note" style="margin-bottom:14px;">Cada semana mistura 1 verbo + 1 conetor com 8 palavras do tema da semana. Aqui está o percurso completo:</p>`;
  groups.forEach(g=>{
    const label = g.start === g.end ? `Semana ${g.start}` : `Semanas ${g.start}–${g.end}`;
    const isCurrent = state.currentWeek >= g.start && state.currentWeek <= g.end;
    const isDone = state.currentWeek > g.end;
    html += `<div class="roadmap-row ${isCurrent?'current':''}">
      <span class="roadmap-weeks">${label}</span>
      <span class="roadmap-theme">${g.theme}</span>
      <span class="roadmap-status">${isDone?'concluído':isCurrent?'agora':''}</span>
    </div>`;
  });
  content.innerHTML = html;
}

function renderAll(content){
  content.innerHTML = `
    <input class="search-input" id="searchBox" placeholder="Procurar uma palavra...">
    <div id="wordList"></div>
  `;
  const listEl = document.getElementById("wordList");

  function draw(filter){
    const f = (filter||"").toLowerCase().trim();
    let rows = "";
    WEEKS.forEach((weekWords, wIdx)=>{
      const wk = wIdx + 1;
      const reached = wk <= state.currentWeek;
      weekWords.forEach(triple=>{
        const [en, pt] = triple;
        if(f && !en.toLowerCase().includes(f) && !pt.toLowerCase().includes(f)) return;
        rows += `<div class="word-row" style="opacity:${reached?1:0.45}">
          <span class="en">${en}</span>
          <span class="pt">${pt}</span>
          <span class="wk">sem. ${wk}</span>
        </div>`;
      });
    });
    listEl.innerHTML = rows || `<p class="empty-note">Sem resultados.</p>`;
  }
  draw("");
  document.getElementById("searchBox").addEventListener("input", (e)=> draw(e.target.value));
}

function renderSettings(content){
  content.innerHTML = `
    <div class="settings-block">
      <h3>Saltar para outra semana</h3>
      <p>Se precisares de recuar ou avançar manualmente.</p>
      <div class="week-jump">
        <input type="number" id="weekInput" min="1" max="${totalWeeks()}" value="${state.currentWeek}">
        <button class="btn-sec" id="jumpBtn">Ir</button>
      </div>
    </div>

    <div class="settings-block">
      <h3>Sobre esta lista</h3>
      <p>${totalWords()} palavras de português europeu ao longo de ${totalWeeks()} semanas (cerca de ${Math.round(totalWeeks()/52*10)/10} anos ao ritmo de uma semana por semana). Cada semana combina 1 verbo, 1 conetor/preposição e algumas palavras de um tema — os temas alternam a cada semana e voltam mais tarde com palavras novas. Vê a aba "Panorama" para o percurso completo.</p>
    </div>

    <div class="settings-block">
      <h3>Recomeçar</h3>
      <p>Isto apaga o teu progresso (semana atual e palavras marcadas) e volta à semana 1.</p>
      <button class="btn-sec danger" id="resetBtn">Recomeçar do zero</button>
    </div>
  `;

  document.getElementById("jumpBtn").addEventListener("click", ()=>{
    const v = parseInt(document.getElementById("weekInput").value, 10);
    if(v >= 1 && v <= totalWeeks()){
      state.currentWeek = v;
      queueSave();
      activeTab = "week";
      render();
    }
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Tens a certeza? Isto apaga o teu progresso guardado.")){
      state.currentWeek = 1;
      state.known = {};
      queueSave();
      activeTab = "week";
      render();
    }
  });
}

loadState();
</script>
